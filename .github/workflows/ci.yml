name: Node CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CI: true
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn lint
      - run: corepack yarn audit:deprecated

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn typecheck

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn build

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn build:docs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn test:prod --runInBand

  packed-consumer:
    needs: [lint, typecheck, package-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn build
      - run: corepack yarn verify:pack
